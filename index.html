<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12"><title>VibeForge — AI Builder</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111521;--panel2:#171d2b;--line:#252d40;--muted:#8791a7;--text:#edf1fa;--accent:#8b7cff;--green:#58d6a0;--red:#ff7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 11px}button:hover{border-color:#6e63c7}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:650}.quiet{background:transparent}.danger{color:var(--red)}.muted{color:var(--muted)}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;background:#0d111b}.logo{font-weight:800;letter-spacing:-.5px;font-size:17px}.logo b{color:var(--accent)}.projectname{color:var(--muted);border-left:1px solid var(--line);padding-left:12px}.spacer{flex:1}.status{font-size:12px;color:var(--green)}.layout{height:calc(100dvh - 58px);display:grid;grid-template-columns:220px minmax(280px,1fr) minmax(300px,360px);min-height:0}.side,.chat{background:var(--panel);min-height:0;display:flex;flex-direction:column}.side{border-right:1px solid var(--line)}.chat{border-left:1px solid var(--line)}.sectionhead{padding:14px 14px 8px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.filelist{padding:5px 8px;overflow:auto}.file{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;padding:8px 9px;color:#cbd2e2}.file.active{background:#282443;color:white}.file .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file .remove{margin-left:auto;opacity:0;color:var(--muted);padding:0 4px;border:0;background:none}.file:hover .remove{opacity:1}.sidebottom{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}.sidebottom button{width:100%;text-align:left}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.tabs{height:46px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line)}.tab{background:transparent;border:0;color:var(--muted)}.tab.active{color:white;background:var(--panel2)}.mainactions{margin-left:auto;display:flex;gap:6px}.workarea{flex:1;min-height:0;position:relative}.editor{height:100%;width:100%;border:0;resize:none;background:#0d111b;color:#dce5f8;padding:18px;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;outline:none;white-space:pre;overflow:auto}.preview{display:none;width:100%;height:100%;border:0;background:white}.chatmessages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.msg{max-width:100%;padding:11px 12px;border-radius:12px;background:var(--panel2);white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#302b50}.msg.assistant{align-self:stretch}.msg .role{font-size:11px;color:var(--muted);margin-bottom:5px}.composer{padding:12px;border-top:1px solid var(--line)}.composer textarea{width:100%;min-height:94px;max-height:220px;resize:vertical;background:#0c1019;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;outline:none}.composefoot{display:flex;align-items:center;gap:8px;margin-top:8px}.composefoot small{color:var(--muted);flex:1}.chathead-actions{display:flex;align-items:center;gap:5px}.chathead-actions button{font-size:11px;padding:6px 8px;white-space:nowrap}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text);font-size:25px;margin:0 0 8px}.empty p{max-width:440px}.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{width:min(560px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.modal h2{margin:0 0 8px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;padding:10px;background:#0b101a;color:white;border:1px solid var(--line);border-radius:8px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{font-size:12px;color:var(--muted);line-height:1.6}.preview-error{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;padding:10px 12px;border:1px solid #a94b5b;border-radius:9px;background:#28151c;color:#ffdce2;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:32%;overflow:auto}.mainactions [hidden],.preview-error[hidden]{display:none}.mobilebar{display:none}
@media(max-width:850px){.layout{grid-template-columns: minmax(0,1fr)}.side{display:none}.chat{display:none;border:0}.layout[data-view="chat"] .chat{display:flex;position:absolute;inset:58px 0 0;z-index:3}.layout[data-view="chat"] .main{display:none}.layout[data-view="files"] .side{display:flex;position:absolute;inset:58px 0 0;z-index:3}.layout[data-view="files"] .main{display:none}.top{padding:0 10px}.projectname{display:none}.mobilebar{display:flex;gap:5px}.mobilebar button{padding:6px 9px}.status{display:none}.mainactions button{padding:7px}.tabs{padding:0 8px}.chat{border-left:0}.top .hide-mobile{display:none}}
</style>
</head>
<body>
<header class="top"><div class="logo">Vibe<b>Forge</b></div><div class="projectname" id="projectLabel">새 프로젝트</div><div class="mobilebar"><button id="filesMobile">파일</button><button id="chatMobile">AI 채팅</button></div><div class="spacer"></div><span class="status" id="saveStatus">● 로컬 저장됨</span><button id="exportBtn">내보내기</button></header>
<div class="layout" id="layout">
<aside class="side"><div class="sectionhead"><span>프로젝트 파일</span><button id="newFileBtn">＋</button></div><div class="filelist" id="fileList"></div><div class="sidebottom"><button id="newProjectBtn">＋ 새 프로젝트</button><div class="notice">프로젝트는 현재 브라우저에 자동 저장됩니다.</div></div></aside>
<main class="main"><div class="tabs"><button class="tab active" id="codeTab">⌘ 코드</button><button class="tab" id="previewTab">◫ 미리보기</button><div class="mainactions"><button id="undoBtn" title="실행 취소 (Ctrl+Z)" disabled>↶</button><button id="redoBtn" title="다시 실행 (Ctrl+Y)" disabled>↷</button><button id="viteTemplateBtn" title="React와 Vite 프로젝트 파일 생성">React/Vite</button><button id="fixErrorBtn" hidden>AI 오류 수정</button><button id="runBtn" class="primary">▶ 실행</button></div></div><div class="workarea"><textarea id="editor" class="editor" spellcheck="false" aria-label="코드 편집기" placeholder="파일을 선택하거나 AI에게 만들어 달라고 요청하세요."></textarea><iframe id="preview" class="preview" title="프로젝트 미리보기" sandbox="allow-scripts allow-forms allow-modals"></iframe><div id="previewError" class="preview-error" hidden role="status"></div></div></main>
<aside class="chat"><div class="sectionhead"><span>브라우저 AI</span><div class="chathead-actions"><button class="quiet" id="loadModelBtn">AI 모델 불러오기</button><button class="quiet" id="clearChatBtn">새 대화</button></div></div><div class="chatmessages" id="messages"><div class="empty"><div><h2>무엇을 만들까요?</h2><p>원하는 웹사이트나 기능을 자연어로 설명하면 AI가 프로젝트 파일을 생성하고 수정합니다.</p></div></div></div><div class="composer"><textarea id="prompt" aria-label="AI에게 요청하기" placeholder="예: 모바일에서도 잘 작동하는 3D 포트폴리오 사이트를 만들어줘."></textarea><div class="composefoot"><small id="modelLabel">모델 미실행 · 첫 실행 시 약 500MB 다운로드</small><button class="primary" id="sendBtn">생성하기 ↑</button></div></div></aside>
</div>

<script src="browser-ai.js?v=1.0.0"></script>
<script>
const $=s=>document.querySelector(s);
const starter='<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>나의 첫 프로젝트</title>\n<style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5fb;color:#20243a}.card{background:white;padding:40px;border-radius:20px;max-width:560px;box-shadow:0 15px 50px #20243a18}button{background:#6857e8;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer}</style>\n</head>\n<body><main class="card"><h1>VibeForge에 오신 것을 환영합니다.</h1><p>AI에게 요청해 나만의 웹 프로젝트를 만들어 보세요.</p><button onclick="document.querySelector(&quot;p&quot;).textContent=&quot;첫 번째 기능이 작동합니다!&quot;">테스트하기</button></main></body>\n</html>';
let state={name:'나의 첫 프로젝트',files:{'index.html':starter,'style.css':'/* CSS를 작성하세요 */\n','script.js':'// JavaScript를 작성하세요\n'},active:'index.html',chat:[]};
const history={undo:[],redo:[],last:null,timer:null,limit:80};
function projectSnapshot(){return JSON.stringify({name:state.name,files:state.files,active:state.active});}
function updateHistoryButtons(){const u=$('#undoBtn'),r=$('#redoBtn');if(u)u.disabled=history.undo.length===0;if(r)r.disabled=history.redo.length===0;}
function flushHistory(){if(history.timer){clearTimeout(history.timer);history.timer=null;}const now=projectSnapshot();if(history.last!==null&&history.last!==now){history.undo.push(history.last);if(history.undo.length>history.limit)history.undo.shift();history.redo=[];}history.last=now;updateHistoryButtons();}
function beginStructuralChange(){flushHistory();const now=projectSnapshot();if(history.last!==now){history.undo.push(history.last);if(history.undo.length>history.limit)history.undo.shift();history.redo=[];}else{history.undo.push(now);if(history.undo.length>history.limit)history.undo.shift();history.redo=[];}history.last=now;updateHistoryButtons();}
function scheduleEditorHistory(){if(history.timer)clearTimeout(history.timer);history.timer=setTimeout(flushHistory,450);}
function restoreSnapshot(raw){const snap=JSON.parse(raw);if(!snap||!snap.files||typeof snap.files!=='object')return;state.name=snap.name||'새 프로젝트';state.files=snap.files;state.active=state.files[snap.active]!==undefined?snap.active:Object.keys(state.files)[0];renderFiles();loadEditor();persist();history.last=projectSnapshot();updateHistoryButtons();}
function undoProject(){flushHistory();if(!history.undo.length)return;history.redo.push(projectSnapshot());restoreSnapshot(history.undo.pop());}
function redoProject(){flushHistory();if(!history.redo.length)return;history.undo.push(projectSnapshot());restoreSnapshot(history.redo.pop());}
function persist(){localStorage.setItem('vibeforge-project',JSON.stringify(state));$('#saveStatus').textContent='● 저장됨';}
function renderFiles(){const box=$('#fileList');box.innerHTML='';Object.keys(state.files).forEach(name=>{const b=document.createElement('button');b.className='file'+(name===state.active?' active':'');b.innerHTML='<span>📄</span><span class="fname"></span><span class="remove" title="파일 삭제">×</span>';b.querySelector('.fname').textContent=name;b.onclick=()=>selectFile(name);b.querySelector('.remove').onclick=e=>{e.stopPropagation();if(Object.keys(state.files).length===1)return alert('마지막 파일은 삭제할 수 없습니다.');if(confirm(name+' 파일을 삭제할까요?')){beginStructuralChange();delete state.files[name];state.active=Object.keys(state.files)[0];renderFiles();loadEditor();persist();}};box.append(b)});$('#projectLabel').textContent=state.name;}
function selectFile(name){flushHistory();saveEditor();state.active=name;renderFiles();loadEditor();persist();history.last=projectSnapshot();}
function loadEditor(){$('#editor').value=state.files[state.active]||'';}
function saveEditor(){if(state.active)state.files[state.active]=$('#editor').value;}
function showTab(tab){const isPreview=tab==='preview';$('#editor').style.display=isPreview?'none':'block';$('#preview').style.display=isPreview?'block':'none';$('#codeTab').classList.toggle('active',!isPreview);$('#previewTab').classList.toggle('active',isPreview);if(isPreview)runPreview();}
function runPreview(){saveEditor();$('#previewError').hidden=true;$('#previewError').textContent='';$('#fixErrorBtn').hidden=true;const html=state.files['index.html']||'<h1>index.html 파일이 없습니다.</h1>';const css=state.files['style.css']||'';const js=state.files['script.js']||'';const monitor='<script>(function(){function report(kind,message,stack){try{parent.postMessage({type:"vibeforge-preview-error",kind:kind,message:String(message||"알 수 없는 오류"),stack:String(stack||"").slice(0,3000)},"*")}catch(e){}}window.addEventListener("error",function(e){report("JavaScript 오류",e.message,(e.filename||"")+":"+(e.lineno||"")+"\\n"+(e.error&&e.error.stack||""))});window.addEventListener("unhandledrejection",function(e){report("처리되지 않은 Promise 오류",e.reason&&e.reason.message||e.reason,e.reason&&e.reason.stack||"")});var old=console.error;console.error=function(){var a=[].slice.call(arguments);report("console.error",a.map(function(x){try{return typeof x==="string"?x:JSON.stringify(x)}catch(e){return String(x)}}).join(" "));old.apply(console,a)}})();<\/script>';let doc=html;if(doc.includes('</head>'))doc=doc.replace('</head>',monitor+'<style>'+css.replace(/<\/style/gi,'<\\/style')+'</style></head>');else doc=monitor+'<style>'+css.replace(/<\/style/gi,'<\\/style')+'</style>'+doc;doc=doc.replace('</body>','<script>'+js.replace(/<\/script/gi,'<\\/script')+'<\/script></body>');$('#preview').srcdoc=doc;$('#editor').style.display='none';$('#preview').style.display='block';$('#codeTab').classList.remove('active');$('#previewTab').classList.add('active');persist();}
function addMessage(role,content){state.chat.push({role,content});const box=$('#messages');if(box.querySelector('.empty'))box.innerHTML='';const el=document.createElement('div');el.className='msg '+role;const r=document.createElement('div');r.className='role';r.textContent=role==='user'?'나':'VibeForge AI';const body=document.createElement('div');body.textContent=content;el.append(r,body);box.append(el);box.scrollTop=box.scrollHeight;persist();}
function extractFiles(text){let out={};const re=/\x60\x60\x60(?:[a-zA-Z0-9_-]+)?\s*\n([\s\S]*?)\x60\x60\x60/g;let m;while((m=re.exec(text))!==null){const before=text.slice(Math.max(0,m.index-100),m.index);const pathMatch=before.match(/(?:파일|file|path)\s*[:：]?\s*[\x60'"]?([\w./-]+\.(?:html|css|js|jsx|ts|tsx|json|md|py))[\x60'"]?\s*$/i);if(pathMatch)out[pathMatch[1]]=m[1].trim();}return out;}
function parseAIResponse(text){try{let clean=String(text).trim();const fenced=clean.match(/\x60\x60\x60(?:json)?\s*([\s\S]*?)\x60\x60\x60/i);if(fenced)clean=fenced[1].trim();const first=clean.indexOf('{'),last=clean.lastIndexOf('}');if(first<0||last<first)return null;const parsed=JSON.parse(clean.slice(first,last+1));if(!parsed||typeof parsed!=='object'||!parsed.files||typeof parsed.files!=='object'||Array.isArray(parsed.files))return null;return {message:typeof parsed.message==='string'?parsed.message:'파일을 업데이트했습니다.',files:parsed.files};}catch(e){return null;}}function isSafeProjectPath(path){return typeof path==='string'&&path.length>0&&path.length<=180&&!path.startsWith('/')&&!path.includes('..')&&!path.includes('\\\\')&&!/[<>:"|?*\\x00-\\x1f]/.test(path)&&!path.endsWith('/');}
function updateModelProgress(event){const label=$('#modelLabel');if(!label)return;if(event&&event.status==='progress'){const pct=Number.isFinite(event.progress)?Math.round(event.progress):0;const file=event.file?String(event.file).split('/').pop():'';label.textContent='모델 다운로드 '+pct+'%'+(file?' · '+file:'');}else if(event&&event.message){label.textContent=event.message;}else if(event&&event.status==='done'){label.textContent='모델 파일 준비 완료';}}
async function loadBrowserModel(){const button=$('#loadModelBtn');if(!window.VibeForgeBrowserAI){addMessage('assistant','브라우저 AI 파일을 불러오지 못했습니다. 페이지를 새로고침해 주세요.');return;}if(window.VibeForgeBrowserAI.status().ready){$('#modelLabel').textContent='모델 준비 완료 · '+window.VibeForgeBrowserAI.status().runtime;return;}button.disabled=true;button.textContent='불러오는 중…';try{const info=await window.VibeForgeBrowserAI.load(updateModelProgress);$('#modelLabel').textContent='모델 준비 완료 · '+info.runtime;button.textContent='AI 준비 완료';}catch(error){$('#modelLabel').textContent='모델 로드 실패';button.textContent='다시 시도';addMessage('assistant','브라우저 AI 모델을 불러오지 못했습니다: '+(error&&error.message?error.message:String(error))+'\\n인터넷 연결과 브라우저의 WebGPU 지원 여부를 확인해 주세요.');}finally{button.disabled=false;}}
async function sendPrompt(){const promptText=$('#prompt').value.trim();if(!promptText)return;$('#prompt').value='';addMessage('user',promptText);$('#sendBtn').disabled=true;$('#sendBtn').textContent='AI 생각 중…';try{saveEditor();if(!window.VibeForgeBrowserAI)throw new Error('브라우저 AI 런타임(browser-ai.js)을 불러오지 못했습니다.');if(!window.VibeForgeBrowserAI.status().ready){$('#loadModelBtn').disabled=true;$('#loadModelBtn').textContent='모델 불러오는 중…';const info=await window.VibeForgeBrowserAI.load(updateModelProgress);$('#modelLabel').textContent='모델 준비 완료 · '+info.runtime;$('#loadModelBtn').textContent='AI 준비 완료';$('#loadModelBtn').disabled=false;}const result=await window.VibeForgeBrowserAI.generate(promptText,state.chat,updateModelProgress);const parsed=parseAIResponse(result.text);const entries=parsed?Object.entries(parsed.files):[];if(!entries.length){addMessage('assistant',(parsed&&parsed.message?parsed.message:result.text||'응답을 생성하지 못했습니다.')+'\\n\\n실행 환경: '+result.runtime+' · 브라우저 내 로컬 실행');return;}const safeEntries=entries.filter(([path,value])=>isSafeProjectPath(path)&&typeof value==='string');if(!safeEntries.length)throw new Error('AI 응답에서 적용할 수 있는 안전한 파일을 찾지 못했습니다. 요청을 더 구체적으로 작성해 주세요.');beginStructuralChange();for(const [path,value] of safeEntries)state.files[path]=value;state.active=state.files['index.html']!==undefined?'index.html':safeEntries[0][0];renderFiles();loadEditor();persist();addMessage('assistant',String(parsed.message||'요청한 파일을 생성하거나 수정했습니다.')+'\\n\\n변경 파일 ('+safeEntries.length+'): '+safeEntries.map(x=>x[0]).join(', ')+'\\n실행 버튼으로 결과를 확인하세요.\\n실행 환경: '+result.runtime+' · 브라우저 내 로컬 실행');}catch(err){addMessage('assistant','브라우저 AI 오류: '+(err&&err.message?err.message:String(err)));}finally{$('#sendBtn').disabled=false;$('#sendBtn').textContent='보내기 ↑';$('#loadModelBtn').disabled=false;}}
function createViteProject(){if(!confirm('현재 프로젝트 파일을 React/Vite 템플릿으로 교체할까요? 기존 프로젝트를 먼저 ZIP으로 내보내는 것을 권장합니다.'))return;beginStructuralChange();state.name='React + Vite 프로젝트';state.files={'package.json':JSON.stringify({name:'vibeforge-react-app',private:true,version:'1.0.0',type:'module',scripts:{dev:'vite --host 0.0.0.0',build:'vite build',preview:'vite preview --host 0.0.0.0'},dependencies:{'@vitejs/plugin-react':'^4.3.4',react:'^19.0.0','react-dom':'^19.0.0'},devDependencies:{vite:'^6.0.0'}},null,2)+'\n','index.html':'<!doctype html>\n<html lang="ko">\n  <head>\n    <meta charset="UTF-8" />\n    <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n    <meta name="theme-color" content="#101426" />\n    <title>React + Vite App</title>\n  </head>\n  <body>\n    <div id="root"></div>\n    <script type="module" src="/src/main.jsx"><\/script>\n  </body>\n</html>\n','vite.config.js':"import { defineConfig } from 'vite';\nimport react from '@vitejs/plugin-react';\n\nexport default defineConfig({\n  plugins: [react()],\n  server: { host: '0.0.0.0' }\n});\n",'src/main.jsx':"import React from 'react';\nimport { createRoot } from 'react-dom/client';\nimport App from './App.jsx';\nimport './style.css';\n\ncreateRoot(document.getElementById('root')).render(\n  <React.StrictMode>\n    <App />\n  </React.StrictMode>\n);\n",'src/App.jsx':"import { useState } from 'react';\n\nexport default function App() {\n  const [count, setCount] = useState(0);\n  return (\n    <main className=\"app-shell\">\n      <section className=\"welcome-card\">\n        <span className=\"eyebrow\">VIBEFORGE STARTER</span>\n        <h1>React 프로젝트가 준비되었습니다.</h1>\n        <p>이 파일을 수정하거나 VibeForge AI에게 원하는 기능을 요청하세요.</p>\n        <button onClick={() => setCount((value) => value + 1)}>클릭 {count}회</button>\n      </section>\n    </main>\n  );\n}\n",'src/style.css':":root { font-family: Inter, system-ui, sans-serif; color: #f5f6ff; background: #101426; font-synthesis: none; text-rendering: optimizeLegibility; }\n* { box-sizing: border-box; }\nbody { margin: 0; min-width: 320px; min-height: 100vh; }\nbutton { border: 0; border-radius: 12px; padding: 12px 18px; background: #8b7cff; color: white; font: inherit; font-weight: 700; cursor: pointer; }\nbutton:focus-visible { outline: 3px solid #c7c0ff; outline-offset: 3px; }\n.app-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #292451, transparent 45%), #101426; }\n.welcome-card { width: min(100%, 620px); padding: clamp(24px, 6vw, 52px); border: 1px solid #343957; border-radius: 24px; background: #191f35; box-shadow: 0 24px 80px #0005; }\n.eyebrow { color: #a99fff; font-size: 12px; font-weight: 800; letter-spacing: .16em; }\nh1 { margin: 16px 0; font-size: clamp(28px, 6vw, 44px); line-height: 1.12; }\np { color: #b9bfd3; line-height: 1.7; }\n",'README.md':"# React + Vite 프로젝트\n\n## 실행 방법\n\n1. Node.js 20.19+ 또는 22.12+를 설치합니다.\n2. 프로젝트 폴더에서 `npm install`을 실행합니다.\n3. `npm run dev`로 개발 서버를 시작합니다.\n4. 배포용 파일은 `npm run build`로 `dist/`에 생성합니다.\n\nVibeForge의 브라우저 미리보기는 정적 HTML/CSS/JS용입니다. React/Vite 프로젝트는 ZIP으로 내보낸 뒤 Vite 실행 환경에서 실행해야 합니다.\n"};state.active='src/App.jsx';state.chat=[];$('#messages').innerHTML='<div class="empty"><div><h2>React + Vite 프로젝트</h2><p>파일이 생성되었습니다. ZIP으로 내보낸 뒤 Node.js 환경에서 npm install과 npm run dev를 실행하세요.</p></div></div>';renderFiles();loadEditor();showTab('code');persist();addMessage('assistant','React + Vite 기본 구조를 생성했습니다. package.json, Vite 설정, React 진입점, App 컴포넌트, 스타일, README가 포함되어 있습니다. ZIP으로 내보낸 뒤 Node.js 환경에서 실행하세요. 이 브라우저 미리보기는 React 번들 빌드를 수행하지 않습니다.');}
function exportProject(){saveEditor();const files=state.files;const names=Object.keys(files);const blobText=names.map(n=>'===== '+n+' =====\n'+files[n]).join('\n\n');if(window.JSZip){const zip=new JSZip();names.forEach(n=>zip.file(n,files[n]));zip.generateAsync({type:'blob'}).then(b=>downloadBlob(b,'vibeforge-project.zip'));}else downloadBlob(new Blob([blobText],{type:'text/plain;charset=utf-8'}),'vibeforge-project-files.txt');}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);}
window.addEventListener('message',e=>{if(e.source!==$('#preview').contentWindow||!e.data||e.data.type!=='vibeforge-preview-error')return;const detail=[e.data.kind||'오류',e.data.message||'알 수 없는 오류',e.data.stack||''].filter(Boolean).join('\\n');$('#previewError').textContent='미리보기 오류\\n'+detail;$('#previewError').hidden=false;$('#fixErrorBtn').hidden=false;});$('#fixErrorBtn').onclick=()=>{const detail=$('#previewError').textContent;$('#prompt').value='현재 미리보기에서 발생한 오류를 분석하고 원인을 찾아 실제 코드로 수정해 주세요. 기존 기능과 디자인은 유지하고, 수정한 파일 전체 내용을 반환하세요.\\n\\n오류 정보:\\n'+detail+'\\n\\n현재 선택 파일: '+state.active+'\\n'+(state.files[state.active]||'');$('#layout').dataset.view='chat';$('#prompt').focus();};$('#codeTab').onclick=()=>showTab('code');$('#previewTab').onclick=()=>showTab('preview');$('#runBtn').onclick=runPreview;$('#sendBtn').onclick=sendPrompt;$('#loadModelBtn').onclick=loadBrowserModel;$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendPrompt();}});$('#editor').addEventListener('input',()=>{state.files[state.active]=$('#editor').value;$('#saveStatus').textContent='● 저장 중';scheduleEditorHistory();clearTimeout(window.saveTimer);window.saveTimer=setTimeout(persist,400);});$('#undoBtn').onclick=undoProject;$('#redoBtn').onclick=redoProject;document.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey;if(!mod)return;const key=e.key.toLowerCase();if(key==='z'&&!e.shiftKey){e.preventDefault();undoProject();}else if(key==='y'||(key==='z'&&e.shiftKey)){e.preventDefault();redoProject();}});$('#exportBtn').onclick=exportProject;$('#viteTemplateBtn').onclick=createViteProject;$('#newFileBtn').onclick=()=>{const name=prompt('새 파일 이름 (예: app.js)');if(!name)return;const path=name.trim().replace(/^\/+/, '');if(!/^[\w./-]+$/.test(path)||path.includes('..'))return alert('올바른 파일 이름을 입력하세요.');if(state.files[path])return alert('이미 존재하는 파일입니다.');beginStructuralChange();state.files[path]='';state.active=path;renderFiles();loadEditor();persist();};$('#newProjectBtn').onclick=()=>{if(!confirm('새 프로젝트를 만들까요? 현재 프로젝트는 브라우저에 저장되어 있지만 새 프로젝트로 전환됩니다.'))return;beginStructuralChange();state={...state,name:'새 프로젝트',files:{'index.html':starter,'style.css':'','script.js':''},active:'index.html',chat:[]};renderFiles();loadEditor();$('#messages').innerHTML='';persist();};$('#clearChatBtn').onclick=()=>{state.chat=[];$('#messages').innerHTML='<div class="empty"><div><h2>새 대화</h2><p>새로운 기능을 요청해 보세요.</p></div></div>';persist();};$('#filesMobile').onclick=()=>$('#layout').dataset.view='files';$('#chatMobile').onclick=()=>$('#layout').dataset.view='chat';document.addEventListener('click',e=>{if(e.target.closest('.file')||e.target.closest('#codeTab')||e.target.closest('#previewTab'))$('#layout').dataset.view='';});
try{const saved=localStorage.getItem('vibeforge-project');if(saved){const parsed=JSON.parse(saved);if(parsed.files)state={...state,...parsed};}}catch(e){}renderFiles();loadEditor();history.last=projectSnapshot();updateHistoryButtons();$('#modelLabel').textContent=window.VibeForgeBrowserAI?'브라우저 AI · 모델을 불러오세요':'AI 런타임을 불러오지 못했습니다';state.chat.forEach(m=>{const box=$('#messages');if(box.querySelector('.empty'))box.innerHTML='';const el=document.createElement('div');el.className='msg '+m.role;const r=document.createElement('div');r.className='role';r.textContent=m.role==='user'?'나':'VibeForge AI';const b=document.createElement('div');b.textContent=m.content;el.append(r,b);box.append(el);});
</script>
